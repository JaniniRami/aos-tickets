# Root / → no app, no redirect. App only under /aos (and /aos/…). API: /aos/api/ → backend.

server {
    listen 80 default_server;
    server_name 46.225.168.215 _;

    # No redirect — empty response (browser shows a blank page).
    location = / {
        default_type text/plain;
        return 204;
    }

    # /aos without trailing slash — serve SPA, no 301 to /aos/
    location = /aos {
        alias /usr/share/nginx/html/aos/index.html;
    }

    location /aos/api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aos/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /aos/index.html;
    }
}

# Root / → blank. App under /aos/. API: /aos/api/ → backend.

server {
    listen 80 default_server;
    server_name 46.225.168.215 _;

    include /etc/nginx/mime.types;

    location = / {
        default_type text/plain;
        return 204;
    }

    location = /login {
        return 302 /aos/login;
    }

    location = /favicon.ico {
        default_type image/x-icon;
        return 204;
    }

    # Same URL in browser; internally serve the /aos/ tree (correct index.html + MIME)
    location = /aos {
        rewrite ^ /aos/ last;
    }

    location /aos/api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aos/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /aos/index.html;
    }
}

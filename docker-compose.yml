# Full stack: Postgres + FastAPI + Vite build behind nginx.
# Usage: docker compose up --build
#
# backend/.env must define POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (for db container)
# and DATABASE_URL with host `db`, same user/password/db (see backend/.env.example).
# If you change POSTGRES_USER after the first run: docker compose down -v && docker compose up -d
# (recreate volume) or the new role will not exist.
#
# VPS: / → blank (204); app http://46.225.168.215/aos  ·  API /aos/api/…  ·  port 80

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    volumes:
      - aos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    environment:
      # DATABASE_URL comes from backend/.env (must use host `db` in Docker, not localhost).
      BASE_URL: ${BASE_URL:-http://46.225.168.215/aos}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Amman}
      ADULT_TICKET_PRICE_JD: ${ADULT_TICKET_PRICE_JD:-3}
      KID_TICKET_PRICE_JD: ${KID_TICKET_PRICE_JD:-12}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  aos_pgdata:

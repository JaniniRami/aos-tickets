# Full stack: Postgres + FastAPI + Vite build behind nginx.
# Usage: docker compose up --build
#
# VPS: http://46.225.168.215/aos/  ·  API: /aos/api/…  ·  open port 80
# BASE_URL must match public app URL (QR codes).
# ADMIN_USERNAME, ADMIN_PASSWORD, JWT_SECRET: set in backend/.env (loaded via env_file).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres2026aos
      POSTGRES_DB: aos
    volumes:
      - aos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    environment:
      # Overrides backend/.env so the app uses the compose DB service, not localhost.
      DATABASE_URL: postgresql://postgres:postgres2026aos@db:5432/aos
      BASE_URL: ${BASE_URL:-http://46.225.168.215/aos}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Amman}
      ADULT_TICKET_PRICE_JD: ${ADULT_TICKET_PRICE_JD:-3}
      KID_TICKET_PRICE_JD: ${KID_TICKET_PRICE_JD:-12}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  aos_pgdata:

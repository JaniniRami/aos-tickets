# Full stack: Postgres + FastAPI + Vite build behind nginx.
# Usage: docker compose --env-file ./backend/.env up --build
# (needed so ${POSTGRES_USER} etc. resolve for backend DATABASE_URL; db also reads backend/.env)
#
# VPS: / → blank (204); app http://46.225.168.215/aos  ·  API /aos/api/…  ·  port 80
# BASE_URL must match public app URL (QR codes).
# backend/.env: POSTGRES_*, ADMIN_*, JWT_SECRET, …

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    volumes:
      - aos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    environment:
      # Same credentials as db service (from backend/.env); host `db` is the compose network name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BASE_URL: ${BASE_URL:-http://46.225.168.215/aos}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Amman}
      ADULT_TICKET_PRICE_JD: ${ADULT_TICKET_PRICE_JD:-3}
      KID_TICKET_PRICE_JD: ${KID_TICKET_PRICE_JD:-12}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  aos_pgdata:
